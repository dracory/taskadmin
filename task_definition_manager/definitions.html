<div id="app">
  <template v-if="loading">
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading data...</span>
      </div>
    </div>
  </template>

  <template v-else>
    <!-- Filter Bar -->
    <div class="card bg-body-tertiary mb-3">
      <div class="card-body d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center">
          <button @click="openFilterModal()" class="btn btn-primary me-3">
            <i class="bi bi-funnel me-1"></i> Filters
          </button>
          <span class="text-body">{{ filterStatus }}</span>
        </div>
        <div class="d-flex align-items-center gap-2">
          <button
            @click="clearFilters()"
            class="btn btn-sm btn-outline-secondary"
            title="Clear all filters"
            v-if="hasActiveFilters"
          >
            <i class="bi bi-x-circle"></i>
          </button>
          <button class="btn btn-primary btn-sm" @click="openCreateModal">
            <i class="bi bi-plus-circle me-1"></i> New Definition
          </button>
        </div>
      </div>
    </div>

    <!-- Definitions Table -->
    <div v-if="definitions.length === 0" class="text-center py-4 text-muted border rounded">
      No task definitions found matching your criteria.
    </div>

    <div v-else class="table-responsive">
      <table class="table table-striped table-hover table-bordered align-middle">
        <thead>
          <tr>
            <th @click="sortBy('title')" style="cursor: pointer;">
              Title
              <span v-if="sortByColumn === 'title'">
                {{ sortOrder === 'asc' ? '&#8595;' : '&#8593;' }}
              </span>
            </th>
            <th @click="sortBy('alias')" style="cursor: pointer;">
              Alias
              <span v-if="sortByColumn === 'alias'">
                {{ sortOrder === 'asc' ? '&#8595;' : '&#8593;' }}
              </span>
            </th>
            <th @click="sortBy('status')" style="cursor: pointer; width: 1px; white-space: nowrap;">
              Status
              <span v-if="sortByColumn === 'status'">
                {{ sortOrder === 'asc' ? '&#8595;' : '&#8593;' }}
              </span>
            </th>
            <th @click="sortBy('created_at')" style="cursor: pointer; width: 1px; white-space: nowrap;">
              Created
              <span v-if="sortByColumn === 'created_at'">
                {{ sortOrder === 'asc' ? '&#8595;' : '&#8593;' }}
              </span>
            </th>
            <th @click="sortBy('updated_at')" style="cursor: pointer; width: 1px; white-space: nowrap;">
              Updated
              <span v-if="sortByColumn === 'updated_at'">
                {{ sortOrder === 'asc' ? '&#8595;' : '&#8593;' }}
              </span>
            </th>
            <th style="width: 1px; white-space: nowrap;">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="definition in definitions" :key="definition.id">
            <td>{{ definition.title }}</td>
            <td><code>{{ definition.alias }}</code></td>
            <td>
              <span class="badge" :class="statusBadgeClass(definition.status)">{{ definition.status }}</span>
            </td>
            <td>{{ formatDate(definition.created_at) }}</td>
            <td>{{ formatDate(definition.updated_at) }}</td>
            <td class="text-nowrap">
              <button
                class="btn btn-sm btn-outline-secondary me-1"
                @click="openEditModal(definition)"
                title="Edit"
              >
                <i class="bi bi-pencil-square"></i>
              </button>
              <button
                class="btn btn-sm btn-outline-danger"
                @click="deleteDefinition(definition)"
                title="Delete"
              >
                <i class="bi bi-trash"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="d-flex justify-content-between align-items-center mt-3" v-if="totalPages > 1">
      <div class="text-muted">
        Showing {{ definitions.length }} of {{ totalDefinitions }} definitions
      </div>
      <nav>
        <ul class="pagination mb-0">
          <li class="page-item" :class="{ disabled: currentPage === 0 }">
            <button class="page-link" @click="goToPage(currentPage - 1)" :disabled="currentPage === 0">Previous</button>
          </li>
          <li class="page-item" v-for="page in pageNumbers" :key="page" :class="{ active: page === currentPage }">
            <button class="page-link" @click="goToPage(page)">{{ page + 1 }}</button>
          </li>
          <li class="page-item" :class="{ disabled: currentPage >= totalPages - 1 }">
            <button class="page-link" @click="goToPage(currentPage + 1)" :disabled="currentPage >= totalPages - 1">Next</button>
          </li>
        </ul>
      </nav>
      <div>
        <select v-model="perPage" @change="changePerPage" class="form-select form-select-sm" style="width: auto;">
          <option :value="10">10 per page</option>
          <option :value="25">25 per page</option>
          <option :value="50">50 per page</option>
          <option :value="100">100 per page</option>
        </select>
      </div>
    </div>
  </template>

  <!-- Filter Modal -->
  <div v-if="showFilterModal" class="modal d-block" style="background: rgba(0,0,0,0.5);" @click.self="closeFilterModal">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Filters</h5>
          <button type="button" class="btn-close" @click="closeFilterModal"></button>
        </div>
        <div class="modal-body">
          <div v-for="(condition, index) in modalConditions" :key="index" class="d-flex gap-2 mb-2 align-items-center">
            <select v-model="condition.field" class="form-select" style="width: 200px;" @change="condition.value = ''">
              <option v-for="opt in conditionOptions" :key="opt.value" :value="opt.value">{{ opt.label }}</option>
            </select>
            <select v-model="condition.operator" class="form-select" style="width: 120px;">
              <option v-for="op in operatorsFor(condition.field)" :key="op" :value="op">{{ opLabels[op] || op }}</option>
            </select>
            <input
              v-if="inputTypeFor(condition.field) === 'text'"
              v-model="condition.value"
              type="text"
              class="form-control"
              :placeholder="placeholderFor(condition.field)"
            >
            <input
              v-else-if="inputTypeFor(condition.field) === 'date'"
              v-model="condition.value"
              type="date"
              class="form-control"
            >
            <select
              v-else-if="inputTypeFor(condition.field) === 'select'"
              v-model="condition.value"
              class="form-select"
            >
              <option value="">-- select --</option>
              <option v-for="opt in optionsFor(condition.field)" :key="opt.value" :value="opt.value">{{ opt.label }}</option>
            </select>
            <button class="btn btn-outline-danger btn-sm" @click="removeModalCondition(index)" title="Remove">
              <i class="bi bi-x"></i>
            </button>
          </div>
          <button class="btn btn-outline-primary btn-sm mt-2" @click="addModalCondition">
            <i class="bi bi-plus"></i> Add condition
          </button>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline-secondary" @click="closeFilterModal">Cancel</button>
          <button class="btn btn-outline-danger" @click="clearModalConditions">Clear all</button>
          <button class="btn btn-primary" @click="applyFilters">Apply filters</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Create / Edit Modal -->
  <div v-if="showEditModal" class="modal d-block" style="background: rgba(0,0,0,0.5);" @click.self="showEditModal = false">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">{{ editForm.id ? 'Update Task Definition' : 'Create Task Definition' }}</h5>
          <button type="button" class="btn-close" @click="showEditModal = false"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Title</label>
            <input v-model="editForm.title" type="text" class="form-control" placeholder="Task title">
          </div>
          <div class="mb-3">
            <label class="form-label">Alias</label>
            <input v-model="editForm.alias" type="text" class="form-control font-monospace" placeholder="task-alias">
            <div class="form-text">Unique identifier used to enqueue the task.</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Status</label>
            <select v-model="editForm.status" class="form-select">
              <option value="active">active</option>
              <option value="inactive">inactive</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea v-model="editForm.description" class="form-control" rows="6"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline-secondary" @click="showEditModal = false">Cancel</button>
          <button class="btn btn-primary" @click="saveDefinition" :disabled="saving">
            {{ saving ? 'Saving...' : 'Save' }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
